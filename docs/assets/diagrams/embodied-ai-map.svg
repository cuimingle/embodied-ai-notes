<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="#242720" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">具身智能知识地图：执行闭环、学习与模型、共同基础与工程验证</title>
  <desc id="map-desc">执行闭环由感知与状态估计、决策与规划、运动与控制、环境反馈构成。强化学习、模仿学习和表征学习是获取能力的方法；VLM、VLA 和世界模型是不同模型专题，两者可以跨越多个系统模块。数理与机器人学、数据与系统、评测与迁移共同支撑系统。强化学习是本站当前主线。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
      .muted { fill: #666d60; }
      .section { font-size: 21px; font-weight: 650; }
      .label { font-size: 23px; font-weight: 650; }
      .detail { font-size: 18px; fill: #666d60; }
      .rule { fill: none; stroke: #d8dcd1; stroke-width: 1; }
      .flow { fill: none; stroke: #626a58; stroke-width: 1.5; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#626a58" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f5f5f0"/>
  <text x="42" y="36" class="mono muted" font-size="13" letter-spacing="2">A KNOWLEDGE ATLAS</text>
  <text x="42" y="78" font-size="29" font-weight="650">同一套系统，三个观察角度。</text>
  <text x="1158" y="76" text-anchor="end" class="mono muted" font-size="13">EMBODIED AI / 01</text>

  <!-- Runtime relationships are the only directional connections in this map. -->
  <text x="42" y="130" class="section">01 / 执行闭环</text>
  <text x="1158" y="130" text-anchor="end" class="detail">运行时，各部分如何协作</text>
  <g>
    <rect x="42" y="154" width="260" height="110" fill="#ffffff" stroke="#d8dcd1"/>
    <rect x="42" y="154" width="3" height="110" fill="#242720"/>
    <text x="64" y="195" class="label">感知与状态估计</text>
    <text x="64" y="232" class="detail">观测 · 定位 · 记忆与融合</text>

    <rect x="327" y="154" width="260" height="110" fill="#ffffff" stroke="#d8dcd1"/>
    <text x="349" y="195" class="label">决策与规划</text>
    <text x="349" y="232" class="detail">目标分解 · 技能 · 路径</text>

    <rect x="612" y="154" width="260" height="110" fill="#ffffff" stroke="#d8dcd1"/>
    <text x="634" y="195" class="label">运动与控制</text>
    <text x="634" y="232" class="detail">轨迹跟踪 · 力与动作执行</text>

    <rect x="897" y="154" width="260" height="110" fill="#e9eddf" stroke="#cbd2bd"/>
    <text x="919" y="195" class="label">环境反馈</text>
    <text x="919" y="232" class="detail">物体变化 · 接触 · 新观测</text>
  </g>
  <g class="flow" marker-end="url(#flow-arrow)">
    <path d="M302 209 H327"/>
    <path d="M587 209 H612"/>
    <path d="M872 209 H897"/>
    <path d="M1027 264 V297 H172 V264"/>
  </g>
  <text x="600" y="325" text-anchor="middle" class="detail">依据新的观测，持续修正行为</text>
  <path class="rule" d="M42 349 H1158"/>

  <!-- Learning paradigms and model families are separate, overlapping views. -->
  <text x="42" y="387" class="section">02 / 学习与模型</text>
  <text x="1158" y="387" text-anchor="end" class="detail">可用于闭环中的多个模块</text>
  <g>
    <path d="M42 412 H582 M618 412 H1158" stroke="#242720" stroke-width="1.5"/>
    <text x="62" y="447" font-size="22" font-weight="650">学习方法</text>
    <text x="176" y="447" class="detail">用什么信号获得能力</text>
    <rect x="62" y="469" width="153" height="34" fill="#c9df75"/>
    <text x="73" y="493" font-size="19" font-weight="650">强化学习 / RL</text>
    <text x="257" y="493" font-size="20" font-weight="600">模仿学习</text>
    <text x="437" y="493" font-size="20" font-weight="600">表征学习</text>
    <text x="62" y="533" class="detail">本站主线</text>
    <text x="257" y="533" class="detail">从示范学习</text>
    <text x="437" y="533" class="detail">学习有效特征</text>

    <text x="638" y="447" font-size="22" font-weight="650">模型专题</text>
    <text x="752" y="447" class="detail">怎样组织信息与预测后果</text>
    <text x="638" y="493" font-size="20" font-weight="600">VLM</text>
    <text x="818" y="493" font-size="20" font-weight="600">VLA</text>
    <text x="998" y="493" font-size="20" font-weight="600">世界模型</text>
    <text x="638" y="533" class="detail">视觉与语言</text>
    <text x="818" y="533" class="detail">条件到动作</text>
    <text x="998" y="533" class="detail">行动后果预测</text>
  </g>
  <path class="rule" d="M42 558 H1158"/>

  <!-- Shared foundations support the entire system rather than a single stage. -->
  <text x="42" y="599" class="section">03 / 共同基础与工程验证</text>
  <text x="1158" y="599" text-anchor="end" class="detail">让方法可实现，让结果可检查</text>
  <rect x="42" y="623" width="1116" height="89" fill="#e9ebe4"/>
  <path d="M414 640 V695 M786 640 V695" stroke="#cbd0c2"/>
  <text x="64" y="657" font-size="20" font-weight="650">数理与机器人学</text>
  <text x="64" y="689" class="detail">概率 · 优化 · 运动学 · 动力学</text>
  <text x="436" y="657" font-size="20" font-weight="650">数据与系统</text>
  <text x="436" y="689" class="detail">采集 · 仿真 · 标定 · 实时接口</text>
  <text x="808" y="657" font-size="20" font-weight="650">评测与迁移</text>
  <text x="808" y="689" class="detail">泛化 · 安全 · 恢复 · Sim2Real</text>
  <path d="M42 741 H67" class="flow" marker-end="url(#flow-arrow)"/>
  <text x="78" y="747" font-size="15" class="muted">实线箭头表示执行与反馈；学习、模型与共同基础不构成串行步骤。</text>
</svg>
