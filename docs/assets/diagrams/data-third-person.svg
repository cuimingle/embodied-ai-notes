<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">第三视角：从身体外部观察</title>
  <desc id="desc">独立的外部相机通过视锥观察人和桌上的物体操作。相机并未佩戴在人身上。视锥表示可见范围，不是控制信号。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #252922; }
      .heading { font-size: 28px; font-weight: 650; }
      .label { font-size: 24px; font-weight: 550; }
      .note { font-size: 24px; fill: #6b7166; }
      .line { fill: none; stroke: #252922; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #6b7166; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #6b7166; stroke-width: 3; marker-end: url(#arrow); }
      .joint { fill: #f5f5f0; stroke: #252922; stroke-width: 4; }
      .signal { fill: #c9df75; stroke: #252922; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6b7166" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="400" rx="16" fill="#f5f5f0"/>
  <text x="32" y="48" class="heading">第三视角：从身体外部观察</text>
  <path d="M32 68 H688" stroke="#dfe2d8"/>
  <!-- The translucent wedge is a field of view, not a control arrow. -->
  <path d="M185 180 L561 102 L595 291 Z" fill="#c9df75" fill-opacity=".26"/>
  <path d="M185 180 L561 102 M185 180 L595 291" fill="none" stroke="#a6b46e" stroke-width="2"/>
  <rect x="84" y="152" width="78" height="53" rx="8" fill="#fff" stroke="#252922" stroke-width="4"/>
  <path d="M163 164 L185 152 V205 L163 193 Z" class="signal"/>
  <path d="M122 207 V237 M122 237 L83 286 M122 237 L158 286 M122 237 V288" class="line"/>
  <circle cx="424" cy="123" r="23" class="line"/>
  <path d="M409 149 Q391 160 391 187 V236 M435 151 L450 183 L500 209 M409 236 L392 288 M409 236 L441 288" class="line"/>
  <path d="M477 258 H647 M494 259 V290 M630 259 V290" class="line"/>
  <path d="M521 218 V244 Q539 255 557 244 V218 Z" class="signal"/>
  <path d="M557 224 Q576 221 574 234 Q572 242 557 238" class="thin"/>
  <rect x="596" y="221" width="32" height="32" rx="3" fill="#fff" stroke="#6b7166" stroke-width="3"/>
  <text x="75" y="322" class="label">外部相机</text><text x="422" y="322" class="label">动作与空间关系</text>
  <path d="M32 344 H688" stroke="#dfe2d8"/>
  <text x="32" y="378" class="note">概念示意 · 非实测画面</text>
</svg>
