site_name: 具身智能学习笔记
site_description: 从强化学习出发，理解机器人如何感知、决策与行动。
site_url: !ENV [SITE_URL, 'https://cuimingle.github.io/embodied-ai-notes/']
repo_url: https://github.com/cuimingle/embodied-ai-notes
repo_name: cuimingle/embodied-ai-notes
edit_uri: edit/main/docs/
site_author: Embodied AI Notes contributors
copyright: Copyright © 2026 Embodied AI Notes contributors · MIT License
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/robot-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: zh
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/rl-demos.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/vendor/mathjax/3.2.2/tex-svg-full.js
  - assets/javascripts/rl-core.js
  - assets/javascripts/rl-simulations.js
  - assets/javascripts/rl-widgets.js
hooks:
  - scripts/book_hooks.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - 开始:
      - 首页: index.md
      - 路线与进度: roadmap.md
      - 参考资料: references.md
  - 强化学习:
      - 知识地图: rl/index.md
      - 教材与页码对照: rl/reading-guide.md
      - 符号体系: rl/notation.md
      - 01 · 基本概念: rl/01-basic-concepts.md
      - 02 · 状态价值与 Bellman 方程: rl/02-bellman-equation.md
      - 03 · Bellman 最优方程: rl/03-bellman-optimality.md
      - 04 · 价值迭代与策略迭代: rl/04-value-policy-iteration.md
      - 05 · Monte Carlo: rl/05-monte-carlo.md
      - 06 · 随机逼近: rl/06-stochastic-approximation.md
      - 07 · TD 方法: rl/07-temporal-difference.md
      - 08 · 价值函数方法: rl/08-value-function-methods.md
      - 09 · 策略梯度: rl/09-policy-gradient.md
      - 10 · Actor-Critic: rl/10-actor-critic.md
      - 走向具身任务: rl/to-embodied.md
  - 书外扩展:
      - 阅读说明: extensions/index.md
      - TRPO: extensions/trpo.md
      - PPO 与 GAE: extensions/ppo.md
      - GRPO: extensions/grpo.md
      - GSPO: extensions/gspo.md
  - 实验:
      - 教材动画与代码: labs/textbook.md
      - 补充 · 4×4 GridWorld: labs/gridworld.md
  - 维护:
      - 写作规范: project/writing.md
      - 本地预览与发布: project/publishing.md
