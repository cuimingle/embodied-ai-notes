site_name: 具身智能学习笔记
site_description: 从强化学习出发，理解机器人如何感知、决策与行动。
site_url: !ENV [SITE_URL, 'https://cuimingle.github.io/embodied-ai-notes/']
repo_url: https://github.com/cuimingle/embodied-ai-notes
repo_name: cuimingle/embodied-ai-notes
edit_uri: edit/main/docs/
site_author: Embodied AI Notes contributors
copyright: Copyright © 2026 Embodied AI Notes contributors · MIT License
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/robot-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: zh
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - 开始:
      - 首页: index.md
      - 路线与进度: roadmap.md
      - 参考资料: references.md
  - 强化学习:
      - 知识地图: rl/index.md
      - 01 · MDP 与回报: rl/01-mdp.md
      - 02 · Bellman 与动态规划: rl/02-bellman.md
      - 03 · Monte Carlo: rl/03-monte-carlo.md
      - 04 · 随机梯度与随机逼近: rl/04-stochastic-gradient.md
      - 05 · TD 与 Q-learning: rl/05-temporal-difference.md
      - 06 · 价值函数逼近: rl/06-value-approximation.md
      - 07 · 策略函数逼近: rl/07-policy-approximation.md
      - 08 · Actor-Critic 与 GAE: rl/08-actor-critic.md
      - 09 · TRPO: rl/09-trpo.md
      - 10 · PPO: rl/10-ppo.md
      - 11 · GRPO: rl/11-grpo.md
      - 12 · GSPO: rl/12-gspo.md
      - 走向具身任务: rl/to-embodied.md
  - 实验:
      - GridWorld · 规划与学习: labs/gridworld.md
  - 维护:
      - 写作规范: project/writing.md
      - 本地预览与发布: project/publishing.md
