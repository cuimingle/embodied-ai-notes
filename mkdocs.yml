site_name: 具身智能学习笔记
site_description: 先建立具身智能知识全貌，再沿强化学习主线理解机器人如何感知、决策与行动。
site_url: !ENV [SITE_URL, 'https://cuimingle.github.io/embodied-ai-notes/']
repo_url: https://github.com/cuimingle/embodied-ai-notes
repo_name: cuimingle/embodied-ai-notes
edit_uri: edit/main/docs/
site_author: Embodied AI Notes contributors
copyright: Copyright © 2026 Embodied AI Notes contributors · MIT License
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/robot-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: zh
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/rl-demos.css
  - assets/stylesheets/simulation.css
extra_javascript:
  - assets/javascripts/site-ui.js
  - assets/javascripts/mathjax.js
  - assets/vendor/mathjax/3.2.2/tex-svg-full.js
  - assets/javascripts/rl-core.js
  - assets/javascripts/rl-simulations.js
  - assets/javascripts/rl-widgets.js
  - assets/javascripts/simulation-widgets.js
hooks:
  - scripts/book_hooks.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - 首页: index.md
  - 知识全貌:
      - 系统知识地图: embodied-ai-overview.md
      - 快速概览系列:
          - 什么是具身智能: quick-overview/concept.md
          - 抓取、操作、运动和导航: quick-overview/tasks.md
          - 主要技术栈: quick-overview/stack.md
          - 分方向必读论文: quick-overview/papers.md
  - 数据:
      - 数据地图: data/index.md
      - 遥操 · Teleoperation: data/teleoperation.md
      - UMI · 手持交互: data/umi.md
      - EGO · 第一视角: data/egocentric.md
      - HumanCentric · 人体交互: data/human-centric.md
      - 第三视角 · Exocentric: data/third-person.md
      - 仿真数据 · Simulation: data/simulation.md
  - 强化学习:
      - 主线导览: rl/index.md
      - 教材与页码对照: rl/reading-guide.md
      - 符号体系: rl/notation.md
      - 01 · 基本概念: rl/01-basic-concepts.md
      - 02 · Bellman 方程: rl/02-bellman-equation.md
      - 03 · Bellman 最优方程: rl/03-bellman-optimality.md
      - 04 · 价值迭代与策略迭代: rl/04-value-policy-iteration.md
      - 05 · Monte Carlo: rl/05-monte-carlo.md
      - 06 · 随机逼近: rl/06-stochastic-approximation.md
      - 07 · TD 方法: rl/07-temporal-difference.md
      - 08 · 价值函数方法: rl/08-value-function-methods.md
      - 09 · 策略梯度: rl/09-policy-gradient.md
      - 10 · Actor-Critic: rl/10-actor-critic.md
  - 策略模型:
      - 策略模型地图: policies/index.md
      - ACT · 动作分块: policies/act.md
      - SmolVLA · 轻量 VLA: policies/smolvla.md
      - π₀ · 通用机器人策略: policies/pi0.md
  - 仿真:
      - 仿真导览: simulation/index.md
      - 物理模型与接触: simulation/physics.md
      - 物理求解器: simulation/solvers.md
      - 时间积分与控制频率: simulation/time-stepping.md
      - MuJoCo 最小实践: simulation/mujoco.md
  - 实验室:
      - 教材动画与代码: labs/textbook.md
      - 仿真基础实验: labs/simulation-basics.md
      - 补充 · 4×4 GridWorld: labs/gridworld.md
  - 进阶专题:
      - 书外扩展导览: extensions/index.md
      - TRPO: extensions/trpo.md
      - PPO 与 GAE: extensions/ppo.md
      - GRPO: extensions/grpo.md
      - GSPO: extensions/gspo.md
      - 从 RL 到具身任务: rl/to-embodied.md
  - 阅读指南:
      - 学习路线与进度: roadmap.md
      - 参考资料: references.md
      - 写作规范: project/writing.md
      - 本地预览与发布: project/publishing.md
